# Local-only override for container testing, never used in production. Merge
# it over docker-compose.yml to publish the service at localhost:8088 while
# keeping the same image and network shape the production file describes.
services:
  gtm-portfolio-web:
    ports:
      - "8088:80"

# docker-compose.yml declares `proxy` as `external: true`, since in production
# the reverse proxy stack already owns that network. Compose does not
# auto-create networks declared external, so on a local engine where no other
# stack has created a `proxy` network yet, `docker compose
# -f docker-compose.yml -f docker-compose.local.yml up` fails with "network
# ... declared as external, but could not be found". Overriding
# `external: false` here, for local runs only, lets Compose create its own
# project-scoped `proxy` network instead, so local testing does not need a
# manual `docker network create proxy` step first.
networks:
  proxy:
    external: false
