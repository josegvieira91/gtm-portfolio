# Single default server block. This is the only server in the image, so it
# answers every request regardless of Host header — Nginx Proxy Manager
# routes to this container by Docker service name and terminates TLS itself,
# so no server_name, TLS directive, or HTTPS redirect belongs here.
server {
    listen 80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Video is bind-mounted at runtime (docker-compose.yml), never baked into
    # the image. nginx:alpine's default sendfile behavior already answers
    # Range requests with 206 Partial Content — do not disable sendfile and
    # do not add Range-specific directives here.
    location /videos/ {
        alias /usr/share/nginx/videos/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
