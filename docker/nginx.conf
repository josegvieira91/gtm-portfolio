# Single default server block. This is the only server in the image, so it
# answers every request regardless of Host header — Nginx Proxy Manager
# routes to this container by Docker service name and terminates TLS itself,
# so no server_name, TLS directive, or HTTPS redirect belongs here.
server {
    listen 80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    # Anti-clickjacking + MIME-sniffing hardening (T-02-06, threat register).
    # These apply to every response served from this server level, which
    # covers `location /` below (every HTML document, including /contact
    # which carries the Cal.com iframe). nginx's add_header inheritance rule
    # means a location block that defines its OWN add_header (Cache-Control,
    # below) stops inheriting these two — so they're repeated inline inside
    # /_astro/ and /videos/ rather than relied on from here alone.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Astro's build output under /_astro/ is content-hashed — confirmed
    # against a real `npm run build`: JS, CSS, AND the self-hosted JetBrains
    # Mono woff2 files all land here with a hash baked into the filename
    # (e.g. gsap.Dv5YJmMY.js, jetbrains-mono-latin-wght-normal.B9CIFXIH.woff2),
    # so fonts need no separate rule. A changed file always gets a new
    # filename on rebuild, which makes a full year `immutable` safe here,
    # unlike /videos/ below where filenames are stable across re-recordings.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Video is bind-mounted at runtime (docker-compose.yml), never baked into
    # the image. nginx:alpine's default sendfile behavior already answers
    # Range requests with 206 Partial Content — do not disable sendfile and
    # do not add Range-specific directives here.
    #
    # Cache-Control is a moderate 7-day max-age WITHOUT `immutable` (WR-03
    # code review fix): video filenames (case-<NN>-<slug>.mp4) carry no
    # content hash or version suffix, and docs/lab-accounts.md and
    # docs/recording-sop.md both anticipate re-recording a case later under
    # the same filename. `immutable` told conforming browsers never to
    # revalidate for a full year, so a replaced file under an existing name
    # would be invisible to anyone with a cached copy for up to a year.
    # 7 days without `immutable` still gets real caching benefit for a
    # mostly-static portfolio site while keeping a re-recorded case visible
    # to a returning visitor within a week even without a hard reload.
    location /videos/ {
        alias /usr/share/nginx/videos/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
