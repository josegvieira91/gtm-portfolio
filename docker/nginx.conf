# Single default server block. This is the only server in the image, so it
# answers every request regardless of Host header. The reverse proxy in front
# of it routes by Docker service name and terminates TLS, so no server_name,
# TLS directive, or HTTPS redirect belongs here.
server {
    listen 80 default_server;
    # server_tokens defaults to `on`, so every response and every built-in
    # error page discloses the exact nginx version. That is free
    # reconnaissance for anyone fingerprinting the host.
    server_tokens off;
    # nginx's automatic trailing-slash redirect (try_files $uri $uri/ below)
    # builds its Location header from $scheme as seen on THIS container's
    # internal HTTP connection from the proxy, not the client's original
    # HTTPS request. A request for /about (no trailing slash) therefore 301'd
    # to an http:// URL, which the proxy's own force-SSL rule bounced back to
    # https:// on a second hop: a real plaintext round trip in the middle of
    # an HTTPS session.
    # absolute_redirect off makes nginx emit a scheme-relative Location
    # instead of hardcoding http, closing that hop.
    absolute_redirect off;

    # nginx:alpine ships with gzip commented out in its base config, so the
    # home page's ~110KB of inlined diagram payloads and SVGs, plus every
    # JS/CSS chunk, was served uncompressed. text/html is
    # compressed by default whenever `gzip on` is set (no need to list it in
    # gzip_types); the rest of this project's actual response content types
    # are listed explicitly.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;
    # With no error_page/404 route, a typo'd or retired case URL rendered
    # nginx's stock white "404 Not Found" page: off-brand, and with no way
    # back to the site. /404.html is Astro's build output for
    # src/pages/404.astro.
    error_page 404 /404.html;

    # Anti-clickjacking and MIME-sniffing hardening, plus Referrer-Policy.
    # /contact frames app.cal.com, an uncontrolled third-party context, and a
    # full-referrer leak into it is a one-liner to close.
    # These apply to every response served from this
    # server level, which covers `location /` below (every HTML document,
    # including /contact). nginx's add_header inheritance rule means a
    # location block that defines its OWN add_header (Cache-Control, below)
    # stops inheriting these three, so they are repeated inline inside every
    # location that sets its own add_header.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # With no Cache-Control here, browsers fall back to heuristic freshness
    # for HTML (commonly ~10% of the document's age), so a returning visitor
    # could hold a stale index.html referencing content-hashed /_astro/
    # chunks the next deploy deleted. `no-cache` still allows caching; it
    # only forces revalidation on every load, which is what an entry document
    # in front of a hashed-asset pipeline wants. This location defines its
    # own add_header, so per the inheritance rule above the three headers
    # must be repeated.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # `internal` blocks this from ever being requested directly -- it's only
    # ever served by the error_page redirect above.
    location = /404.html {
        internal;
    }

    # Astro's build output under /_astro/ is content-hashed, confirmed
    # against a real `npm run build`: JS, CSS, and the self-hosted JetBrains
    # Mono woff2 files all land here with a hash baked into the filename
    # (e.g. gsap.Dv5YJmMY.js, jetbrains-mono-latin-wght-normal.B9CIFXIH.woff2),
    # so fonts need no separate rule. A changed file always gets a new
    # filename on rebuild, so a full year of `immutable` is safe here.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
