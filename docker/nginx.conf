# Single default server block. This is the only server in the image, so it
# answers every request regardless of Host header — Nginx Proxy Manager
# routes to this container by Docker service name and terminates TLS itself,
# so no server_name, TLS directive, or HTTPS redirect belongs here.
server {
    listen 80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Video is bind-mounted at runtime (docker-compose.yml), never baked into
    # the image. nginx:alpine's default sendfile behavior already answers
    # Range requests with 206 Partial Content — do not disable sendfile and
    # do not add Range-specific directives here.
    #
    # Cache-Control is a moderate 7-day max-age WITHOUT `immutable` (WR-03
    # code review fix): video filenames (case-<NN>-<slug>.mp4) carry no
    # content hash or version suffix, and docs/lab-accounts.md and
    # docs/recording-sop.md both anticipate re-recording a case later under
    # the same filename. `immutable` told conforming browsers never to
    # revalidate for a full year, so a replaced file under an existing name
    # would be invisible to anyone with a cached copy for up to a year.
    # 7 days without `immutable` still gets real caching benefit for a
    # mostly-static portfolio site while keeping a re-recorded case visible
    # to a returning visitor within a week even without a hard reload.
    location /videos/ {
        alias /usr/share/nginx/videos/;
        add_header Cache-Control "public, max-age=604800";
    }
}
