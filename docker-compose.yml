# Production shape. The container joins an existing external `proxy` network
# and is reached only by Docker service name. It publishes no host port and
# terminates no TLS; the reverse proxy in front of it does both.
services:
  gtm-portfolio-web:
    container_name: gtm-portfolio-web
    image: gtm-portfolio-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    networks:
      - proxy
    # No `ports:` key here on purpose: this container is not published on any
    # host port. The reverse proxy reaches it by Docker service name on the
    # `proxy` network. Do not add one; docker-compose.local.yml carries the
    # local-only override that does publish a port.

networks:
  proxy:
    external: true
